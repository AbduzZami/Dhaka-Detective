<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhaka Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-time detective workspace. Rain-lit hero, manila case files, a side rail of objectives,
   and tabbed tools (scene, interviews, case file, board, timeline, solve). Single dark world by design. */
:root{
  --night:#0d1416; --panel:#131d20; --raise:#1a272b; --raise-2:#213136; --line:#2a3b40;
  --ink:#e7e2d6; --muted:#8fa19d; --faint:#5f716d;
  --sodium:#f2a23a; --sodium-soft:rgba(242,162,58,.14); --on-sodium:#1b1206;
  --thread:#d4483c; --thread-soft:rgba(212,72,60,.16);
  --paper:#e9ddc3; --paper-2:#dccdad; --paper-ink:#2a241c; --paper-muted:#6b5f4c;
  --ok:#79c48f; --ok-soft:rgba(121,196,143,.14);
  --cork:#5b4330; --cork-2:#4c3726;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono","Hind Siliguri",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.02;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);padding:9px 15px;border-radius:6px;font-weight:600;font-size:14px;line-height:1.2;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sodium);color:var(--on-sodium);border-color:var(--sodium)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--thread);color:var(--ink);background:var(--thread-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.amber{border-color:var(--sodium);color:var(--sodium)}
.chip.red{border-color:var(--thread);color:#f0a59c}
.chip.green{border-color:var(--ok);color:var(--ok)}

/* ---------- HOME ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(60% 90% at 82% 0%,rgba(242,162,58,.22),transparent 60%),var(--night)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-inner{position:relative;padding-block:56px 44px;display:grid;gap:22px}
.logo{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(64px,13vw,168px);line-height:.82;letter-spacing:-.005em}
.logo .l2{color:var(--sodium);display:block}
.logo-bn{font-family:var(--f-body);font-weight:600;font-size:clamp(18px,2.6vw,26px);color:var(--muted)}
.hero p.lede{max-width:56ch;font-size:17px;color:var(--ink)}
.hero .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding-block:36px 64px}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:30px;text-transform:uppercase}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.folder{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:2px 8px 8px 8px;padding:22px 20px 18px;margin-top:18px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.folder::before{content:"";position:absolute;left:0;top:-18px;width:44%;height:20px;background:var(--paper);border-radius:8px 8px 0 0}
.folder .eyebrow{color:var(--paper-muted)}
.folder h3{font-size:34px;text-transform:uppercase;line-height:.95}
.folder p{color:var(--paper-ink);font-size:14.5px}
.folder .meta{display:flex;flex-wrap:wrap;gap:6px}
.folder .chip{border-color:var(--paper-muted);color:var(--paper-muted)}
.folder .stamp{position:absolute;right:14px;top:14px;transform:rotate(8deg);font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em;color:#9b2c22;border:3px solid #9b2c22;padding:2px 8px;border-radius:4px;opacity:.85}
.folder .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.folder .btn{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.folder .btn.ghost{background:transparent;color:var(--paper-ink)}
.folder .prog{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.folder .prog i{display:block;height:100%;background:var(--paper-ink)}
.locked{border:1px dashed var(--line);border-radius:8px;padding:20px;display:grid;gap:8px;margin-top:18px;color:var(--muted);background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,255,255,.015) 10px 20px)}
.locked h3{font-size:26px;text-transform:uppercase;color:var(--ink);opacity:.75}
.profile{border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;background:var(--panel);align-self:start}
.badge{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.badge svg{width:56px;height:56px}
.badge b{font-family:var(--f-display);font-size:28px;text-transform:uppercase;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-top:1px solid var(--line);padding-top:8px}
.stat .v{font-family:var(--f-mono);font-size:20px}
.ranks{display:grid;gap:4px;font-size:13px}
.ranks div{display:flex;justify-content:space-between;color:var(--muted)}
.ranks div.on{color:var(--sodium)}
.howto{display:grid;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.howto li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sodium)}
footer.foot{border-top:1px solid var(--line);padding-block:20px;color:var(--faint);font-size:13px}
footer.foot .credit{color:var(--muted);font-size:14px;margin-bottom:6px}
footer.foot .credit a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
footer.foot .credit a:hover{text-decoration-color:currentColor}

/* ---------- BRIEFING ---------- */
.brief{padding-block:32px 64px;display:grid;gap:24px;max-width:980px}
.dossier{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:28px clamp(18px,4vw,40px);display:grid;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);position:relative}
.dossier h1{font-size:clamp(44px,8vw,80px);text-transform:uppercase;line-height:.9}
.dossier .eyebrow{color:var(--paper-muted)}
.dossier p{max-width:66ch;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;border-top:1px solid var(--paper-2);border-bottom:1px solid var(--paper-2);padding-block:12px}
.facts div{display:grid;gap:2px}
.facts b{font-family:var(--f-mono);font-size:13px;font-weight:500}
.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sus{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;background:var(--paper-2);border-radius:6px;padding:12px}
.sus svg{width:72px;height:72px;border-radius:4px}
.sus h4{font-size:22px;text-transform:uppercase}
.sus p{font-size:14px}
.fineprint{font-size:12.5px;color:var(--paper-muted)}

/* ---------- PLAY ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,20,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand span{color:var(--sodium)}
.topbar .case-t{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.timer{font-family:var(--f-mono);font-size:14px;color:var(--sodium);font-variant-numeric:tabular-nums}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{padding:5px 9px;font-size:13px;color:var(--muted)}
.lang button.on{background:var(--raise-2);color:var(--ink)}
.play{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding-block:20px 60px}
@media (max-width:920px){.play{grid-template-columns:1fr}.side .locs,.side .prog-block{display:none}}
.side{display:grid;gap:16px;align-content:start}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px}
.objective{border-color:var(--sodium);background:linear-gradient(var(--sodium-soft),var(--sodium-soft)),var(--panel)}
.objective p{font-size:15px;margin-top:6px}
.locs{display:grid;gap:6px}
.loc{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
.loc b{font-weight:600}
.loc small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.loc.on{border-color:var(--sodium)}
.loc:disabled{opacity:.5;cursor:not-allowed}
.meter{display:grid;gap:6px}
.meter .bar{height:6px;border-radius:3px;background:var(--raise-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--sodium)}
.meter .row{display:flex;justify-content:space-between;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--sodium)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.panel-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h h2{font-size:34px;text-transform:uppercase}
.loc-chips{display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@media (max-width:920px){.loc-chips{display:flex}}
.loc-chips .btn.on{border-color:var(--sodium);color:var(--sodium)}

/* scene */
.scene{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0a1012}
.scene svg{display:block;width:100%;height:auto;max-width:100%}
.hs{cursor:zoom-in}
.hs .hit{fill:transparent;stroke:transparent;stroke-width:3}
.hs:hover .hit,.hs:focus-visible .hit{fill:rgba(242,162,58,.08);stroke:rgba(242,162,58,.55);stroke-dasharray:6 5}
.hs:focus{outline:none}
.hs .mk{fill:none;stroke:var(--sodium);stroke-width:2;opacity:.75}
.hs .mk-dot{fill:var(--sodium);opacity:.9}
.hs.seen .mk{stroke:var(--muted);opacity:.5}
.hs.seen .mk-dot{fill:var(--muted);opacity:.6}
.hs .pulse{fill:none;stroke:var(--sodium);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.hs.seen .pulse{display:none}
@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.1)}}
.rain line{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translate(0,-24px)}to{transform:translate(-6px,24px)}}
.steam path{animation:steam 3s ease-in-out infinite;opacity:.4}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-6px);opacity:.45}}
.scene-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}

/* interviews */
.people{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.person{flex:0 0 auto;display:grid;justify-items:center;gap:4px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);width:104px;text-align:center}
.person svg{width:64px;height:64px;border-radius:50%}
.person b{font-size:13.5px;line-height:1.2}
.person small{font-size:11.5px;color:var(--muted);line-height:1.2}
.person.on{border-color:var(--sodium);background:var(--raise)}
.person:disabled{opacity:.4;cursor:not-allowed}
.convo{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:1100px){.convo{grid-template-columns:1fr}}
.log{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;display:grid;gap:12px;align-content:start;min-height:260px;max-height:560px;overflow-y:auto}
.msg{display:grid;gap:3px;max-width:62ch}
.msg .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.msg.q{justify-self:end;text-align:right}
.msg.q .bubble{background:var(--raise-2);border-color:var(--line)}
.bubble{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--raise);font-size:15px}
.msg.a .bubble{border-left:3px solid var(--sodium)}
.msg .note{font-size:12px;color:var(--sodium)}
.qs{display:grid;gap:8px;align-content:start}
.qbtn{display:grid;gap:4px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:14px}
.qbtn:hover{border-color:var(--sodium)}
.qbtn .chip{justify-self:start}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* case file */
.cf{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.cf{grid-template-columns:1fr}}
.pick{display:grid;gap:6px;max-height:420px;overflow-y:auto;padding-right:2px}
.pickitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:14px}
.pickitem.on{border-color:var(--thread);background:var(--thread-soft)}
.pickitem .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pickitem .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.pickitem.on .dot{border-color:var(--thread);background:var(--thread)}
.pickitem .view{font-family:var(--f-mono);font-size:11px;color:var(--sodium);padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.flagbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-block:14px;padding:12px 14px;border:1px dashed var(--thread);border-radius:10px}
.flagbar p{font-size:14px;color:var(--muted);min-width:0;flex:1}
.contras{display:grid;gap:10px}
.contra{border:1px solid var(--line);border-left:3px solid var(--thread);border-radius:8px;padding:12px 14px;background:var(--panel);display:grid;gap:4px}
.contra b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.contra .pair{font-size:12.5px;color:var(--muted)}

/* board */
.board-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.board-tools .hint{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.board-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line);max-height:640px}
.board{position:relative;background:
  radial-gradient(circle at 20% 30%,rgba(0,0,0,.18) 0 1px,transparent 2px) 0 0/9px 9px,
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.05) 0 1px,transparent 2px) 0 0/13px 13px,
  linear-gradient(var(--cork),var(--cork-2))}
.board svg.strings{position:absolute;inset:0;pointer-events:none}
.bcard{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.bcard:active{cursor:grabbing}
.bcard::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--thread);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:1}
.bcard.clue{width:150px;height:88px;background:var(--paper);color:var(--paper-ink);padding:10px 10px 8px;border-radius:2px;display:grid;align-content:start;gap:2px}
.bcard.clue .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)}
.bcard.clue b{font-size:13.5px;line-height:1.2;font-weight:600}
.bcard.person{width:112px;height:124px;background:var(--paper);color:var(--paper-ink);padding:8px 8px 6px;border-radius:2px;display:grid;justify-items:center;gap:2px;text-align:center}
.bcard.person svg{width:76px;height:76px}
.bcard.person b{font-family:var(--f-display);font-size:17px;text-transform:uppercase;line-height:1}
.bcard.person small{font-size:10.5px;color:var(--paper-muted);line-height:1}
.bcard.pending{outline:3px solid var(--sodium);outline-offset:2px}
.bcard.redherring{opacity:.95}

/* timeline */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tl{min-width:720px;padding:14px 16px 10px;display:grid;gap:0}
.tl-row{display:grid;grid-template-columns:110px 1fr;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-row .lab{font-weight:600;font-size:13.5px}
.tl-row .lab small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.track{position:relative;height:46px}
.tick{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(143,161,157,.18)}
.ticks{position:relative;height:22px}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.band{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.35);border-inline:1px solid rgba(242,162,58,.3)}
.claim{position:absolute;top:17px;height:12px;border:1.5px dashed var(--muted);border-radius:6px;background:rgba(143,161,157,.08)}
.claim span{position:absolute;left:6px;top:-17px;font-size:11px;color:var(--muted);white-space:nowrap}
.ev{position:absolute;top:23px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--sodium);color:var(--on-sodium);font-family:var(--f-mono);font-size:10.5px;font-weight:500;display:grid;place-items:center;border:2px solid var(--panel)}
.ev.alt{top:1px}
.evlist{display:grid;gap:6px;margin-top:14px;list-style:none;padding:0}
.evlist li{display:grid;grid-template-columns:24px 58px 1fr;gap:10px;align-items:baseline;font-size:14px}
.evlist .n{width:20px;height:20px;border-radius:50%;background:var(--sodium);color:var(--on-sodium);font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center}
.evlist .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

/* solve */
.solve{display:grid;gap:18px;max-width:880px}
.qblock{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;display:grid;gap:10px}
.qblock h3{font-size:22px;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qblock h3 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}

  if(a.has('grey')) hairSvg = `<path d="M32 36 Q34 20 50 20 Q66 20 68 36 Q60 28 50 28 Q40 28 32 36Z" fill="#bdb6aa"/>`;
  if(a.has('quiff')) front += `<path d="M34 30 Q46 12 66 24 Q60 22 52 27 Q44 24 34 30Z" fill="${hair}"/>`;
  if(a.has('bun')) front += `<circle cx="50" cy="16" r="8" fill="${hair}"/>`;

  if(a.has('cap')) front += `<path d="M31 32 Q50 12 69 32 Z" fill="#2c4a6e"/><rect x="50" y="28" width="26" height="5" rx="2" fill="#2c4a6e"/>`;
  if(a.has('beard')) front += `<path d="M38 50 Q50 70 62 50 Q60 62 50 64 Q40 62 38 50Z" fill="${a.has('greybeard')?'#d8d2c6':hair}"/>`;
  if(a.has('moustache')) front += `<path d="M42 49 Q50 53 58 49" stroke="${a.has('grey')?'#ddd':hair}" stroke-width="3" fill="none"/>`;

  if(a.has('bindi')) front += `<circle cx="50" cy="31" r="2" fill="#b8352b"/>`;

  if(a.has('check')) front += `<g stroke="rgba(0,0,0,.25)" stroke-width="2"><path d="M22 84h56M22 92h56M36 72v28M50 70v30M64 72v28"/></g>`;
  if(a.has('gamcha')) front += `<path d="M60 66 L80 100 L70 100 L54 70Z" fill="#b8352b"/><path d="M62 72 L74 94" stroke="#2f6b3a" stroke-width="3"/>`;
  if(a.has('saree')) front += `<path d="M58 66 L84 100 L66 100 L50 70Z" fill="${a.has('sareegreen')?'#2f6b3a':'#b8352b'}"/><path d="M60 70 L76 96" stroke="#f2c14e" stroke-width="2"/>`;
  if(a.has('tie')) front += `<path d="M48 68 L52 68 L54 92 L50 98 L46 92Z" fill="#7a2f2f"/>`;

function rainLines(x0,y0,w,h,cnt,seed){
  let s = seed||1, out = '';
  const rnd = () => (s = (s*9301+49297)%233280)/233280;
  for(let i=0;i<cnt;i++){ const x = x0 + rnd()*w, y = y0 + rnd()*h; out += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x-4).toFixed(1)}" y2="${(y+14).toFixed(1)}" style="animation-delay:${(-rnd()).toFixed(2)}s"/>`; }
  return `<g class="rain" stroke="#8fb0b8" stroke-opacity=".35" stroke-width="1.2">${out}</g>`;
}
function skyline(y, seed, col, lit){
  let s = seed, x = 0, out = '';
  const rnd = () => (s = (s*9301+49297)%233280)/233280;
  while(x < 1000){ const w = 50 + rnd()*90, h = 60 + rnd()*150; out += `<rect x="${x.toFixed(0)}" y="${(y-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${col}"/>`;
    for(let i=0;i<w*h/1500;i++) if(rnd() < (lit||.3)) out += `<rect x="${(x+6+rnd()*(w-14)).toFixed(0)}" y="${(y-h+8+rnd()*(h-16)).toFixed(0)}" width="6" height="5" fill="#f2a23a" opacity=".6"/>`;
    x += w + 3; }
  return out;
}

function sceneSVG(loc){
  const L0 = C.locs.find(l=>l.id===loc);
  let art = '';
  if(C.art) art = C.art(loc);
  else {
    const sc = L0.scene, bd = BACKDROPS[sc.bg] || BACKDROPS.room;
    art = BD_DEFS + bd(sc) + sc.props.map(p=>{ const P = PROPS[p.p]; if(!P) return ''; const o = Object.assign({}, p.o||{}); if(p.p==='person') o.look = C.people[p.who].look; return `<g transform="translate(${p.x} ${p.y}) scale(${p.s||1})">${P.d(o)}</g>`; }).join('');
  }
  const spots = C.hotspots[loc].map(h=>{
    const seen = G.seen.includes(h.id) ? ' seen' : '';
    const [x,y,w,hh] = h.r, [mx,my] = h.m;
    return `<g class="hs${seen}" data-act="hotspot" data-arg="${h.id}" tabindex="0" role="button" aria-label="${t('inspect')}: ${L(h.label)}">
      <rect class="hit" x="${x}" y="${y}" width="${w}" height="${hh}" rx="8"/>
      <circle class="pulse" cx="${mx}" cy="${my}" r="10"/>
      <circle class="mk" cx="${mx}" cy="${my}" r="10"/><circle class="mk-dot" cx="${mx}" cy="${my}" r="3"/></g>`;
  }).join('');
  return `<svg viewBox="0 0 1000 560" role="img" aria-label="${L(L0.name)}">${art}${spots}</svg>`;
}

   CASES · registry + normaliser for compact case data
   ====================================================================== */
const CASES = [];
const CASE_BY = {};
function registerCase(N){ CASES.push(N); CASE_BY[N.id] = N; }
function addCase(c){
  const N = {id:c.id, no:c.id, diff:c.diff, mins:c.mins, title:c.title, area:c.area, blurb:c.blurb, stamp:c.stamp, brief:c.brief, facts:c.facts};
  N.people = {};
  for(const [id,p] of Object.entries(c.people)) N.people[id] = {name:p.n, short:p.s, role:p.r, intro:p.i, brief:p.b, look:p.look};
  N.client = c.client; N.suspects = c.suspects; N.access = c.access || {};
  N.boardPeople = [...c.suspects, c.client].filter(Boolean);
  N.locs = c.locs.map(l=>({id:l.id, name:l.n, sub:l.sub, lock:l.lock || B('',''), open:l.open ?? 0, scene:l.scene}));
  N.hotspots = {};
  N.locs.forEach(l=>{
    N.hotspots[l.id] = l.scene.props.map((p,i)=>{
      if(!p.h) return null;
      const P = PROPS[p.p], s = p.s || 1, w = P.w*s, h = P.h*s;
      const pad = 6, r = [p.x - pad, p.y - pad, w + pad*2, h + pad*2];
      const m = p.h.m || [p.x + w/2, p.y + Math.min(h/2, 60)];
      return {id:`${l.id}.${i}`, clue:p.h.clue, person:p.h.person || (p.p==='person' ? p.who : undefined), flavor:p.h.flavor, label:p.h.l || (p.who ? N.people[p.who].short : B('','')), r, m};
    }).filter(Boolean);
  });
  N.clues = {};
  for(const [id,v] of Object.entries(c.clues)) N.clues[id] = {loc:v[0], kind:KIND_CODE[v[1]], title:v[2], text:v[3], doc:v[4]};
  N.order = Object.keys(c.clues);
  N.st = {};
  for(const [id,[who,txt]] of Object.entries(c.st)) N.st[id] = {who, en:txt.en, bn:txt.bn};
  N.q = {};
  for(const [pid,list] of Object.entries(c.q)) N.q[pid] = list.map((x,i)=>({id:`${pid}.${i}`, q:x[0], a:x[1], st:(x[2]||{}).st, cl:(x[2]||{}).cl, req:(x[2]||{}).req}));
  N.k = c.k.map(([s,cl,title,text])=>({s, c:cl, title, text}));
  const R = r => { if(!r) return null; const [k,v] = r.split(':'); return k==='c' ? {clue:v} : k==='s' ? {stmt:v} : {q:v}; };
  N.tl = {start:c.tl.start, end:c.tl.end, step:c.tl.step || 15,
    band: c.tl.band ? {from:c.tl.band[0], to:c.tl.band[1], req:R(c.tl.band[2]), label:c.tl.band[3]} : null,
    facts: c.tl.facts.map(([tm,lane,label,req])=>({t:tm, lane, label, req:R(req)})),
    claims: c.tl.claims.map(([lane,from,to,label,stmt])=>({lane, from, to, label, req:stmt}))};
  N.hints = c.hints;
  const opt = arr => arr.map(([id,tt,ss])=>({id, t: tt || (N.people[id] ? N.people[id].short : B(id,id)), s: ss || (N.people[id] ? N.people[id].role : B('',''))}));
  N.solve = {who:opt(c.solve.who), when:opt(c.solve.when), how:opt(c.solve.how)};
  N.ans = c.ans; N.key = c.key; N.sup = c.sup; N.lie = c.lie;
  N.ex = c.ex; N.story = c.story.map(([tt,x])=>({t:tt, x})); N.epi = c.epi;
  N.why = {}; for(const [id,[r,txt]] of Object.entries(c.why)) N.why[id] = [r, txt];
  N.note = c.note;
  registerCase(N);
}

  sakib:[

    {id:'s4', req:['register'], q:{en:`The register has you back at the gate at 7:20.`,bn:`রেজিস্টার বলছে ৭:২০-এ আপনি আবার গেটে এসেছিলেন।`}, a:{en:`Okay, okay. I came back for my charger. Jamal bhai wouldn't let me up without the resident, so I texted Rafi. Here, look.`, bn:`আচ্ছা, আচ্ছা। চার্জার নিতে ফিরে আসছিলাম। জামাল ভাই রেসিডেন্ট ছাড়া উপরে উঠতে দিল না, তাই রাফিরে মেসেজ দিলাম। এই যে, দেখেন।`}, clue:['chat']},

    {id:'j2', q:{en:`Where were you during the power cut?`,bn:`লোডশেডিংয়ের সময় আপনি কোথায় ছিলেন?`}, a:{en:`At the main gate with my torch, the whole twenty minutes. The camera dies when the current goes, so I stand guard myself.`, bn:`পুরা বিশ মিনিট টর্চ নিয়া মেইন গেটে দাঁড়ায়ে ছিলাম। কারেন্ট গেলে ক্যামেরা বন্ধ হয়ে যায়, তাই নিজেই পাহারা দেই।`}, stmt:['j_gate']},
    {id:'j3', q:{en:`Did you see anyone?`,bn:`কাউকে দেখেছিলেন?`}, a:{en:`Sakib bhaiya came back to the gate around 7:20. I didn't send him up, 4B wasn't answering. And about then I saw someone on the back stairs with a big sports bag, hood up. In that dark I couldn't see the face.`, bn:`সাতটা বিশের দিকে সাকিব ভাইয়া আবার গেটে আসছিল। ফোরবি থেকে কেউ ধরতেছিল না, তাই উপরে যাইতে দেই নাই। ওই সময়েই দেখলাম পিছনের সিঁড়ি দিয়া কেউ একটা বড় স্পোর্টস ব্যাগ নিয়া নামতেছে, মাথায় হুড। অন্ধকারে মুখ দেখি নাই।`}, stmt:['j_stairs']},
    {id:'j4', q:{en:`Who locks the side gate?`,bn:`সাইড গেটে খিল কে দেয়?`}, a:{en:`I bolt it myself at seven, every night. Otherwise thieves come in from the back lane.`, bn:`প্রতিদিন সন্ধ্যা সাতটায় আমি নিজেই খিল দেই। নাইলে পিছনের গলি দিয়া চোর ঢোকে।`}, stmt:['j_bolt']},
    {id:'j5', req:['sidegate'], q:{en:`The side gate is unbolted.`,bn:`সাইড গেটের খিল তো খোলা।`}, a:{en:`Unbolted? From inside? Then someone in the building opened it. Nobody can reach that bolt from the lane.`, bn:`খিল খোলা? ভিতর থেকে? তাইলে বিল্ডিংয়েরই কেউ খুলছে। গলি থেকে ওই খিলে হাত যায় না।`}},
    {id:'j6', q:{en:`You hold spare keys to every flat.`,bn:`সব ফ্ল্যাটের ডুপ্লিকেট চাবি তো আপনার কাছে।`}, a:{en:`Yes sir, all of them. But look at the board yourself. Nobody has touched the 4B key.`, bn:`জি স্যার, সব ফ্ল্যাটের চাবি আমার কাছে। কিন্তু বোর্ডটা নিজেই দেখেন। ফোরবির চাবিতে কেউ হাত দেয় নাই।`}},

  mokbul:[
    {id:'m1', q:{en:`Who ordered tea from that building tonight?`,bn:`আজ ওই বিল্ডিং থেকে কে কে চা অর্ডার করেছিল?`}, a:{en:`Only 4B. Rafi bhai, one dudh cha. My boy took it up at five past seven. It's in the khata, on credit as always.`, bn:`ওই বিল্ডিং থেকে খালি ফোরবি। রাফি ভাই, এক কাপ দুধ চা। সাতটা পাঁচে আমার পোলা উপরে দিয়া আসছে। খাতায় লেখা আছে, বরাবরের মতো বাকি।`}},
    {id:'m2', q:{en:`Did you see anyone in the back lane?`,bn:`পেছনের গলিতে কাউকে দেখেছেন?`}, a:{en:`Yes! When the current went. A boy came out of the side gate with a big black bag, hood up, walking fast towards the bazaar. Around 7:25. I'd swear it was the 4B boy, the one who drinks on credit. Didn't even give salam.`, bn:`হ্যাঁ! কারেন্ট যাওয়ার পর। সাইড গেট দিয়া একটা ছেলে বড় কালো ব্যাগ নিয়া বের হইল, মাথায় হুড, বাজারের দিকে জোরে হাঁটতেছিল। সাড়ে সাতটার একটু আগে। আমি কসম খাইয়া বলতে পারি ওইটা ফোরবির ছেলে, যে বাকিতে চা খায়। সালামও দিল না।`}, clue:['sighting']},
    {id:'m3', req:['sighting'], q:{en:`Where does the lane lead?`,bn:`গলিটা কোন দিকে গেছে?`}, a:{en:`That way is Rahman's repair shop, the pharmacy and the bus stand. He came back down the lane a little before eight. The bag looked light by then.`, bn:`ওই দিকে রহমানের রিপেয়ার দোকান, ফার্মেসি আর বাসস্ট্যান্ড। আটটার একটু আগে গলি দিয়া ফিরল, ব্যাগ তখন হালকা লাগতেছিল।`}},
    {id:'m4', req:['receipt'], q:{en:`Do you know Rahman Servicing?`,bn:`রহমান সার্ভিসিং চেনেন?`}, a:{en:`Rahman fixes phones and computers, open till ten. His job slips are yellow, just like that one.`, bn:`রহমান মোবাইল-কম্পিউটার সারায়, রাত দশটা পর্যন্ত খোলা। ওর রসিদ হলুদ রঙের, ঠিক এইটার মতো।`}},

  {t:{en:`7:15 PM`,bn:`৭:১৫`}, x:{en:`Load-shedding. The gate camera stops recording. Rafi wraps the wet laptop in the towel, zips it into his gym bag, opens Tanvir's window to fake a break-in, and slips down the dark back stairs.`,bn:`লোডশেডিং। গেট ক্যামেরার রেকর্ডিং বন্ধ। রাফি ভেজা ল্যাপটপ তোয়ালেতে মুড়ে জিম ব্যাগে ভরে, চুরির নাটক সাজাতে তানভীরের জানালা খুলে দেয়, তারপর অন্ধকার পেছনের সিঁড়ি দিয়ে নেমে যায়।`}},

  B(`In a garment factory in Ashulia, the "golden sample" is the jacket the buyer signed off on. Twenty thousand pieces are checked against it. The buyer's inspector arrives at 10 AM today. At 8 AM the mannequin in the sample room was bare.`,`আশুলিয়ার এক গার্মেন্টস কারখানায় "গোল্ডেন স্যাম্পল" হলো সেই জ্যাকেট, যেটা বায়ার অনুমোদন দিয়েছে। বিশ হাজার পিস এর সাথে মেলানো হয়। আজ সকাল ১০টায় বায়ারের ইন্সপেক্টর আসবেন। সকাল ৮টায় স্যাম্পল রুমের ম্যানিকুইন খালি।`),

   [B('What happened?','কী হয়েছে?'),B(`Twelve bonus envelopes, fifteen thousand each. Shirin counted and sealed them at eleven. They sat in my drawer until four. When I handed them out, Ratan opened his in front of me. Newspaper. Then all of them. Newspaper.`,`বারোটা বোনাসের খাম, প্রত্যেকটায় পনেরো হাজার। এগারোটায় শিরিন গুনে সিল করেছে। চারটা পর্যন্ত আমার ড্রয়ারে ছিল। বিলি করার সময় রতন আমার সামনেই খুলল। খবরের কাগজ। তারপর সবগুলো। খবরের কাগজ।`)],

const ampm = tm => S.lang === 'en' ? (((tm % 1440) >= 720) ? ' PM' : ' AM') : '';
const pname = id => L(C.people[id].short);
const cname = id => L(C.clues[id].title);
const caseNo = c => n(c.no);
const diffName = d => t('diff' + d);
const todayCase = () => { const d = new Date(); const k = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5); return CASES[k % CASES.length]; };
const caseStatus = c => { const g = S.cases[c.id]; if(!g || !g.started) return 'new'; if(g.result) return 'solved'; return 'prog'; };

function caseCard(c, featured){
  const g = S.cases[c.id], st = caseStatus(c);
  const prog = st === 'prog' ? Math.round(g.found.length / c.order.length * 100) : 0;
  const status = st === 'solved' ? `<span class="chip green">${t('stSolved')} · ${n(g.best ?? g.result.total)}</span>` : st === 'prog' ? `<span class="chip amber">${t('stProg')} · ${n(prog)}%</span>` : `<span class="chip">${t('stNew')}</span>`;
  return `<button class="ccard ${featured?'featured':''} ${st}" data-act="open" data-arg="${c.id}">
    <span class="ccard-top"><span class="mono">#${caseNo(c)}</span><span class="chip d${c.diff}">${diffName(c.diff)}</span></span>
    <span class="ccard-title">${L(c.title)}</span>
    <span class="ccard-area">${L(c.area)}</span>
    ${featured ? `<span class="ccard-blurb">${L(c.blurb)}</span>` : ''}
    <span class="ccard-foot">${status}<span class="muted mono">${t('minsX',{x:c.mins})}</span></span>
  </button>`;
}

function objective(){
  const k = G.found.length, total = C.order.length;
  if(k < 2) return t('obj1',{x:L(C.locs[0].name)});
  if(!G.asked.length) return t('obj2');
  if(C.locs.some(l=>!locOpen(l.id))) return t('obj3');
  if(!G.contra.length) return t('obj4');
  if(k < Math.ceil(total*0.7)) return t('obj5');
  return t('obj6');
}

  G.asked.filter(id=>mine.has(id)).forEach(id=>{

}

/* ---------- board ---------- */
const BW = 1180, BH = 600, CW = 150, CH = 88, PW = 112, PH = 124;
let connectMode = false, pending = null;
function bpos(id){
  const p = G.board.pos[id]; if(p) return p;
  const pi = C.boardPeople.indexOf(id);
  if(pi > -1) return {x:70 + pi*(1040/Math.max(4,C.boardPeople.length)), y:28};
  const i = C.order.indexOf(id); return {x:30 + (i%7)*162, y:200 + Math.floor(i/7)*130 + (i%2)*18};
}
const bsize = id => C.boardPeople.includes(id) ? [PW,PH] : [CW,CH];
function renderBoard(){
  const items = C.boardPeople.map(id=>{ const p = bpos(id); return `<div class="bcard person ${pending===id?'pending':''}" data-id="${id}" style="left:${p.x}px;top:${p.y}px">${portrait(C.people[id].look)}<b>${pname(id)}</b><small>${L(C.people[id].role)}</small></div>`; })
    .concat(C.order.filter(has).map(id=>{ const p = bpos(id); return `<div class="bcard clue ${pending===id?'pending':''}" data-id="${id}" style="left:${p.x}px;top:${p.y}px"><span class="k">${L(KINDS[C.clues[id].kind])}</span><b>${cname(id)}</b></div>`; }));
  return `
  <div class="panel-h"><div><div class="eyebrow">${t('bEyebrow')}</div><h2>${t('bTitle')}</h2></div></div>
  <div class="board-tools">
    <button class="btn sm ${connectMode?'primary':''}" data-act="connect">${connectMode ? t('tying') : t('tie')}</button>
    <button class="btn sm" data-act="clearlinks">${t('cut')}</button>
    <button class="btn sm ghost" data-act="tidy">${t('tidy')}</button>
    <span class="hint">${connectMode ? t('bHintC') : t('bHint')}</span>
  </div>
  <div class="board-wrap"><div class="board" id="board" style="width:${BW}px;height:${BH}px"><svg class="strings" id="strings" width="${BW}" height="${BH}" viewBox="0 0 ${BW} ${BH}"></svg>${items.join('')}</div></div>`;
}
function center(id){ const p = bpos(id), [w] = bsize(id); return [p.x + w/2, p.y + 4]; }
function drawStrings(){
  const svg = document.getElementById('strings'); if(!svg) return;
  const curve = (a,b) => { const [x1,y1] = center(a), [x2,y2] = center(b); return `M${x1} ${y1} Q${(x1+x2)/2} ${Math.max(y1,y2)+40} ${x2} ${y2}`; };
  const onBoard = id => C.boardPeople.includes(id) || has(id);
  let out = '';
  G.contra.forEach(k=>{ const K = C.k.find(x=>x.s+'|'+x.c===k); if(!K) return; const who = C.st[K.s].who; if(!C.boardPeople.includes(who) || !has(K.c)) return; out += `<path d="${curve(who,K.c)}" stroke="#f2a23a" stroke-width="2.5" stroke-dasharray="8 6" fill="none" opacity=".9"/>`; });
  G.board.links.forEach(([a,b])=>{ if(onBoard(a) && onBoard(b)) out += `<path d="${curve(a,b)}" stroke="#d4483c" stroke-width="2.5" fill="none"/>`; });
  svg.innerHTML = out;
}
function bindBoard(){
  const board = document.getElementById('board'); if(!board) return;
  drawStrings();
  let drag = null;
  board.addEventListener('pointerdown', e=>{
    const card = e.target.closest('.bcard'); if(!card) return;
    const id = card.dataset.id, p = bpos(id);
    drag = {id, card, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, moved:false};
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  board.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    drag.moved = true;
    const [w,h] = bsize(drag.id);
    const x = Math.max(0, Math.min(BW - w, drag.ox + dx)), y = Math.max(8, Math.min(BH - h, drag.oy + dy));
    G.board.pos[drag.id] = {x, y};
    drag.card.style.left = x + 'px'; drag.card.style.top = y + 'px';
    drawStrings();
  });
  board.addEventListener('pointerup', () => { if(!drag) return; const d = drag; drag = null; if(d.moved) save(); else boardTap(d.id); });
  board.addEventListener('pointercancel', ()=>{ drag = null; });
}
function boardTap(id){
  if(!connectMode){ if(C.clues[id]) showClue(id, false); else { G.talkTo = id; S.tab = 'talk'; render(); } return; }
  if(!pending){ pending = id; render(); return; }
  if(pending === id){ pending = null; render(); return; }
  const links = G.board.links, i = links.findIndex(([a,b]) => (a===pending&&b===id)||(a===id&&b===pending));
  if(i > -1) links.splice(i,1); else links.push([pending,id]);
  pending = null; save(); render();
}

/* ---------- timeline ---------- */
function reqMet(r){
  if(!r) return true;
  if(r.clue) return has(r.clue);
  if(r.stmt) return heard(r.stmt);
  if(r.q) return asked(r.q);
  return false;
}
function renderTimeline(){
  const T0 = C.tl.start, T1 = C.tl.end, step = C.tl.step, pct = v => ((v-T0)/(T1-T0)*100).toFixed(2) + '%';
  const facts = C.tl.facts.filter(f=>reqMet(f.req)).sort((a,b)=>a.t-b.t);
  const num = new Map(facts.map((f,i)=>[f,i+1]));
  const alt = new Map(); const lastIn = {};
  facts.forEach(f=>{ const p = lastIn[f.lane]; const a = p && (f.t - p.t) <= (T1-T0)/40 && !alt.get(p); alt.set(f, !!a); lastIn[f.lane] = f; });
  const ticks = []; for(let v = Math.ceil(T0/step)*step; v <= T1; v += step) ticks.push(v);
  const band = C.tl.band && reqMet(C.tl.band.req) ? C.tl.band : null;
  const bandDiv = band ? `<div class="band" style="left:${pct(band.from)};width:calc(${pct(band.to)} - ${pct(band.from)})"></div>` : '';
  const tickLines = ticks.map(v=>`<div class="tick" style="left:${pct(v)}"></div>`).join('');
  const laneIds = [...new Set([C.client, ...C.suspects, ...C.tl.facts.map(f=>f.lane), ...C.tl.claims.map(c=>c.lane)])].filter(Boolean);
  const lanes = laneIds.map(id=> id === 'unknown' ? {id, name:t('unknownLane'), sub:t('unknownSub')} : {id, name:pname(id), sub:L(C.people[id].role)});
  lanes.sort((a,b)=> (a.id==='unknown') - (b.id==='unknown'));
  const rows = lanes.map(l=>{
    const claims = C.tl.claims.filter(c=>c.lane===l.id && heard(c.req)).map(c=>`<div class="claim" style="left:${pct(c.from)};width:calc(${pct(c.to)} - ${pct(c.from)})"><span>${L(c.label)}</span></div>`).join('');
    const evs = facts.filter(f=>f.lane===l.id).map(f=>`<div class="ev ${alt.get(f)?'alt':''}" style="left:${pct(f.t)}" title="${fmtT(f.t)} · ${L(f.label)}">${n(num.get(f))}</div>`).join('');
    return `<div class="tl-row"><div class="lab">${l.name}<small>${l.sub}</small></div><div class="track">${tickLines}${bandDiv}${claims}${evs}</div></div>`;
  }).join('');
  return `
  <div class="panel-h"><div><div class="eyebrow">${t('tlEyebrow',{x:fmtT(T0)+ampm(T0), y:fmtT(T1)+ampm(T1)})}</div><h2>${t('tTime')}</h2></div>${band ? `<span class="chip amber">${L(band.label)}</span>` : ''}</div>
  <div class="tl-wrap"><div class="tl">
    <div class="tl-row" style="min-height:26px"><div></div><div class="ticks">${ticks.map(v=>`<span style="left:${pct(v)}">${fmtT(v)}</span>`).join('')}</div></div>
    ${rows}
  </div></div>
  <p class="muted" style="font-size:13px;margin-top:10px">${t('tlNote')}</p>
  <ol class="evlist">${facts.map(f=>`<li><span class="n">${n(num.get(f))}</span><span class="t">${fmtT(f.t)}${ampm(f.t)}</span><span>${L(f.label)} <span class="muted">· ${(lanes.find(l=>l.id===f.lane)||{}).name||''}</span></span></li>`).join('')}</ol>`;
}

/* ---------- solve ---------- */
function renderSolve(){
  const d = G.draft;
  const opt = (k, o) => `<button class="opt ${d[k]===o.id?'on':''}" data-act="pick" data-arg="${k}:${o.id}"><b>${L(o.t)}</b><small>${L(o.s)}</small></button>`;
  const evOpts = C.order.filter(has).map(id=>{ const on = d.ev.includes(id); return `<button class="opt ${on?'on':''}" data-act="pickev" data-arg="${id}" ${!on && d.ev.length>=3 ? 'disabled':''}><b>${cname(id)}</b><small>${L(KINDS[C.clues[id].kind])}</small></button>`; }).join('');
  const lieOpts = G.heard.map(id=>{ const s = C.st[id]; return `<button class="opt ${d.lie===id?'on':''}" data-act="pick" data-arg="lie:${id}"><b>${pname(s.who)}</b><small>"${L(s)}"</small></button>`; }).join('');
  const ready = d.culprit && d.when && d.method;
  return `
  <div class="panel-h"><div><div class="eyebrow">${t('sEyebrow')}</div><h2>${t('sTitle')}</h2></div><span class="chip">${t('ptsAvail',{x:100 - G.hints*5})}</span></div>
  <div class="solve">
    ${G.found.length < Math.ceil(C.order.length/2) ? `<div class="card" style="border-color:var(--thread)"><b>${t('thin')}</b> <span class="muted">${t('thinMore',{x:G.found.length, y:n(C.order.length)})}</span></div>` : ''}
    <div class="qblock"><h3>${t('q1')} <small>${t('pts',{x:40})}</small></h3><div class="opts">${C.solve.who.map(o=>opt('culprit',o)).join('')}</div></div>
    <div class="qblock"><h3>${t('q2')} <small>${t('pts',{x:20})}</small></h3><div class="opts">${C.solve.when.map(o=>opt('when',o)).join('')}</div></div>
    <div class="qblock"><h3>${t('q3')} <small>${t('pts',{x:20})}</small></h3><div class="opts">${C.solve.how.map(o=>opt('method',o)).join('')}</div></div>
    <div class="qblock"><h3>${t('q4')} <small>${t('pts',{x:15})} · ${n(d.ev.length)}/${n(3)}</small></h3>${evOpts ? `<div class="opts">${evOpts}</div>` : `<div class="empty">${t('noEv')}</div>`}</div>
    <div class="qblock"><h3>${t('q5')} <small>${t('pts',{x:5})}</small></h3>${lieOpts ? `<div class="opts">${lieOpts}</div>` : `<div class="empty">${t('heardEmpty')}</div>`}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn primary" data-act="submit" ${ready?'':'disabled'}>${t('submit')}</button>
      <span class="muted" style="font-size:13px">${ready ? t('submitReady') : t('submitNeed')}</span>
    </div>
  </div>`;
}

function score(){
  const d = G.draft, A = C.ans;
  const culprit = d.culprit === A.who ? 40 : 0;
  const when = d.when === A.when ? 20 : (A.near && d.when === A.near) ? 5 : 0;
  const method = d.method === A.how ? 20 : 0;
  const ev = Math.min(15, d.ev.reduce((s,id)=> s + (C.key.includes(id) ? 5 : C.sup.includes(id) ? 2 : 0), 0));
  const lie = C.lie[d.lie] || 0;
  const penalty = G.hints * 5;
  const total = Math.max(0, Math.min(100, culprit + when + method + ev + lie - penalty));
  return {culprit, when, method, ev, lie, penalty, total, time:G.elapsed, clues:G.found.length, hints:G.hints, draft:JSON.parse(JSON.stringify(d))};
}

/* ======================================================================

const modalRoot = document.getElementById('modal-root');
let modalState = null;
function openModal(html, dark){
  modalRoot.innerHTML = `<div class="modal-bg" data-act="closemodal-bg"><div class="modal ${dark?'dark':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const b = modalRoot.querySelector('.modal button'); if(b) b.focus();
}
function closeModal(){ modalRoot.innerHTML = ''; modalState = null; }
function showClue(id, isNew){
  modalState = {type:'clue', id, isNew};
  const c = C.clues[id];
  openModal(`${isNew ? `<span class="ribbon">${t('newEvidence')}</span>` : ''}
    <div class="eyebrow">${L(KINDS[c.kind])} · ${L(C.locs.find(l=>l.id===c.loc).name)}</div>
    <h2>${cname(id)}</h2><p>${L(c.text)}</p>${L(c.doc) || ''}
    <div class="acts">${isNew ? `<button class="btn ghost" data-act="tofile" style="background:transparent;color:var(--paper-ink)">${t('openFile')}</button>` : ''}<button class="btn" data-act="closemodal">${isNew ? t('addedFile') : t('close')}</button></div>`);
}
function showFlavor(hid){
  modalState = {type:'flavor', id:hid};
  let h, locId;
  for(const [lid, arr] of Object.entries(C.hotspots)){ const f = arr.find(x=>x.id===hid); if(f){ h = f; locId = lid; } }
  openModal(`<div class="eyebrow">${L(C.locs.find(l=>l.id===locId).name)}</div><h2>${L(h.label)}</h2><p>${L(h.flavor)}</p><div class="acts"><button class="btn" data-act="closemodal">${t('nothingHere')}</button></div>`);
}
function showContra(k){
  modalState = {type:'contra', id:k};
  const K = C.k.find(x=>x.s+'|'+x.c===k);
  openModal(`<span class="ribbon">${t('contraRibbon')}</span><div class="eyebrow">${L(C.people[C.st[K.s].who].name)}</div><h2>${L(K.title)}</h2><p>${L(K.text)}</p><div class="acts"><button class="btn" data-act="closemodal">${t('noted')}</button></div>`);
}
function showHints(){
  modalState = {type:'hints'};
  const h = G.hints;
  openModal(`<div class="eyebrow">${t('hintsEyebrow')}</div><h2>${t('hintsTitle')}</h2>
    ${h ? `<ol class="hintlist">${C.hints.slice(0,h).map(x=>`<li>${L(x)}</li>`).join('')}</ol>` : `<p class="muted">${t('noHints')}</p>`}
    <div class="acts">${h < C.hints.length && !G.result ? `<button class="btn primary" data-act="takehint">${t('revealHint',{x:h+1})}</button>` : ''}<button class="btn" data-act="closemodal">${t('close')}</button></div>`, true);
}
function rerenderModal(){
  if(!modalState || !modalRoot.innerHTML) return;
  const m = modalState;
  if(m.type==='clue') showClue(m.id, m.isNew);
  else if(m.type==='flavor') showFlavor(m.id);
  else if(m.type==='contra') showContra(m.id);
  else if(m.type==='hints') showHints();
}
function toast(msg, kind){
  const el = document.createElement('div'); el.className = 'toast ' + (kind||''); el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

/* ======================================================================
   ACTIONS
   ====================================================================== */
function discover(id){
  if(has(id)) return false;
  const before = C.locs.filter(l=>locOpen(l.id)).map(l=>l.id);
  G.found.push(id);
  C.locs.filter(l=>locOpen(l.id) && !before.includes(l.id)).forEach(l=> setTimeout(()=>toast(t('newLoc',{x:L(l.name)}), 'green'), 400));
  showClue(id, true);
  save();
  return true;
}
function confirmStep(el, label){ if(el.dataset.confirm === '1') return true; el.dataset.confirm = '1'; el.textContent = label; return false; }
function resetUI(){ pickS = pickC = null; connectMode = false; pending = null; }
const ACT = {
  open(a){ setCase(a || S.cur); resetUI(); closeModal(); S.tab = G.result ? S.tab : (G.started ? S.tab : 'scene'); S.screen = !G.started ? 'brief' : G.result ? 'report' : 'play'; save(); render(); window.scrollTo(0,0); },
  begin(){ G.started = true; S.screen = 'play'; S.tab = 'scene'; S.loc = C.locs[0].id; save(); render(); window.scrollTo(0,0); },
  home(){ S.screen = 'home'; save(); render(); window.scrollTo(0,0); },
  filter(a){ S.filter = a; save(); render(); },
  lang(a){ if(S.lang === a) return; S.lang = a; save(); render(); rerenderModal(); },
  tab(a){ S.tab = a; pending = null; save(); render(); },
  goloc(a){ if(!locOpen(a)) return; S.loc = a; S.tab = 'scene'; save(); render(); },
  hotspot(a){
    const h = C.hotspots[S.loc].find(x=>x.id===a); if(!h) return;
    if(!G.seen.includes(a)) G.seen.push(a);
    if(h.person){ G.talkTo = h.person; S.tab = 'talk'; save(); render(); return; }
    if(h.clue){ const isNew = discover(h.clue); render(); if(!isNew) showClue(h.clue, false); return; }
    save(); render(); showFlavor(a);
  },
  talkto(a){ if(!personOpen(a)) return; G.talkTo = a; save(); render(); },
  ask(a){
    const pid = G.talkTo, q = (C.q[pid]||[]).find(x=>x.id===a); if(!q || asked(a)) return;
    G.asked.push(a);
    (q.st||[]).forEach(s=>{ if(!heard(s)){ G.heard.push(s); setTimeout(()=>toast(t('stmtNoted',{x:pname(C.st[s].who), y:L(C.st[s])})), 200); } });
    save(); render();
    (q.cl||[]).forEach(c=> setTimeout(()=>{ if(discover(c)) render(); }, 450));
  },
  pickS(a){ pickS = pickS === a ? null : a; render(); },
  pickC(a){ pickC = pickC === a ? null : a; render(); },
  viewclue(a){ showClue(a, false); },
  flag(){
    if(!pickS || !pickC) return;
    const k = pickS + '|' + pickC, K = C.k.find(x=>x.s+'|'+x.c===k);
    if(!K){ G.wrong++; save(); toast(t('wrongFlag'), 'red'); return; }
    if(G.contra.includes(k)){ toast(t('already',{x:L(K.title)})); return; }
    G.contra.push(k); pickS = pickC = null; save(); render(); showContra(k);
  },
  connect(){ connectMode = !connectMode; pending = null; render(); },
  clearlinks(){ G.board.links = []; pending = null; save(); render(); },
  tidy(){ G.board.pos = {}; save(); render(); },
  pick(a){ const [k,v] = a.split(':'); G.draft[k] = G.draft[k] === v ? null : v; save(); render(); },
  pickev(a){ const ev = G.draft.ev, i = ev.indexOf(a); if(i > -1) ev.splice(i,1); else if(ev.length < 3) ev.push(a); save(); render(); },
  submit(a, el){
    const d = G.draft; if(!(d.culprit && d.when && d.method)) return;
    if(!confirmStep(el, t('confirmClose'))) return;
    const r = score(); G.result = r; G.best = G.best == null ? r.total : Math.max(G.best, r.total);
    S.screen = 'report'; save(); render(); window.scrollTo(0,0);
  },
  hints(){ showHints(); },
  takehint(a, el){ if(!confirmStep(el, t('confirmHint'))) return; G.hints++; save(); render(); showHints(); },
  restart(a, el){
    if(!confirmStep(el, t('eraseConfirm'))) return;
    const best = G.best; S.cases[C.id] = newCase(); G = S.cases[C.id]; G.best = best; G.started = true; G.talkTo = C.client;
    S.screen = 'brief'; S.tab = 'scene'; S.loc = C.locs[0].id; resetUI();
    save(); render(); window.scrollTo(0,0);
  },
  copy(){
    const ta = document.getElementById('sharetext'), txt = ta ? ta.value : '';
    const fallback = () => { if(ta){ ta.focus(); ta.select(); } toast(t('selected')); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast(t('copied'), 'green'), fallback); }catch(e){ fallback(); }
  },
  tofile(){ closeModal(); S.tab = 'file'; save(); render(); },
  closemodal(){ closeModal(); },
  'closemodal-bg'(a, el, e){ if(e.target === el) closeModal(); },
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && modalRoot.innerHTML){ closeModal(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')){ e.preventDefault(); const fn = ACT[e.target.dataset.act]; if(fn) fn(e.target.dataset.arg, e.target, e); }
});

   TIMER + RAIN
   ====================================================================== */
let tickI = null, tickN = 0;
function syncTimer(){
  const run = S.screen === 'play' && G && !G.result && document.visibilityState !== 'hidden';
  if(run && !tickI){ tickI = setInterval(()=>{ G.elapsed++; const el = document.getElementById('timer'); if(el) el.textContent = fmtClock(G.elapsed); if(++tickN % 5 === 0) save(); }, 1000); }
  if(!run && tickI){ clearInterval(tickI); tickI = null; save(); }
}
document.addEventListener('visibilitychange', syncTimer);

function startRain(){
  const cv = document.getElementById('rain'); if(!cv) return;
  const ctx = cv.getContext('2d'); if(!ctx) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, drops = [], sky = [], raf = null, alive = true;
  const size = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = cv.clientWidth; h = cv.clientHeight; cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    drops = Array.from({length: Math.round(w/7)}, () => ({x:Math.random()*w, y:Math.random()*h, v:6+Math.random()*7, l:10+Math.random()*16}));
    sky = []; let x = 0;
    while(x < w){ const bw = 40 + Math.random()*90, bh = 40 + Math.random()*Math.min(170, h*.45); const lights = []; for(let i=0;i<bw*bh/900;i++) if(Math.random()<.35) lights.push([x+6+Math.random()*(bw-12), h-bh+8+Math.random()*(bh-16)]); sky.push({x, bw, bh, lights}); x += bw + 2; }
  };
  const draw = () => {
    ctx.clearRect(0,0,w,h);
    sky.forEach(b=>{ ctx.fillStyle = '#0a1113'; ctx.fillRect(b.x, h-b.bh, b.bw, b.bh); ctx.fillStyle = 'rgba(242,162,58,.55)'; b.lights.forEach(([lx,ly])=>ctx.fillRect(lx,ly,4,3)); });
    ctx.strokeStyle = 'rgba(160,190,196,.28)'; ctx.lineWidth = 1; ctx.beginPath();
    drops.forEach(d=>{ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l*.22, d.y + d.l); if(!reduce){ d.y += d.v; d.x -= d.v*.22; if(d.y > h){ d.y = -20; d.x = Math.random()*(w+60); } } });
    ctx.stroke();
    if(!reduce && alive) raf = requestAnimationFrame(draw);
  };
  size(); draw();
  const onR = () => { size(); if(reduce) draw(); };
  window.addEventListener('resize', onR);
  rainStop = () => { alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onR); };
}

/* ======================================================================
   BOOT
   ====================================================================== */
function start(data){
  const snap = data && data.cases ? data : null;
  S = snap ? Object.assign(fresh(), snap) : (load() || fresh());
  setCase(S.cur);
  render();
}
try{ window.claude?.hot?.snapshot?.(() => S); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});


</script>
